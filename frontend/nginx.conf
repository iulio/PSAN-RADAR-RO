server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GZIP compression — critical for shrinking large GeoJSON payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # Reverse proxy: route all /api/ traffic (including WebSockets) to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # LLM narrative generation and WebSocket keepalive
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Cache static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
